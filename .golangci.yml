run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - typecheck
    - gosimple
    - misspell
    - revive
    - gocritic
    - prealloc

linters-settings:
  errcheck:
    check-type-assertions: false
  govet:
    enable-all: false
  staticcheck:
    checks:
      - all
  revive:
    rules:
      - name: var-naming
        disabled: true
      - name: var-declaration
        disabled: true
      - name: unused-parameter
        disabled: true
  gocritic:
    disabled-checks:
      - singleCaseSwitch
      - elseif
      - underef
      - exitAfterDefer
      - dupSubExpr

issues:
  exclude-rules:
    # CGo generated code may have unusual patterns
    - path: jabraApi\.go
      linters:
        - errcheck
      text: "Jabra_"
    # Allow fmt.Println in main package for TUI output
    - path: cmd\.go
      linters:
        - errcheck
      text: "fmt\\.Print"
    - path: main\.go
      linters:
        - errcheck
      text: "fmt\\.Print"
    # Suppress misspell for existing identifiers and comments
    - linters:
        - misspell
      source: "dongleSettigns|Settigns|devide"
    # Suppress gocritic and errcheck in test files
    - path: _test\.go
      linters:
        - gocritic
        - errcheck
        - revive
    # Suppress revive exported-type warnings in package main
    - linters:
        - revive
      text: "exported"
    # Suppress errcheck for restoreTerminal (terminal cleanup)
    - path: cmd\.go
      linters:
        - errcheck
      text: "IoctlSetTermios"
    # Suppress exitAfterDefer for log.Fatalln in main
    - path: main\.go
      linters:
        - gocritic
      text: "exitAfterDefer"
